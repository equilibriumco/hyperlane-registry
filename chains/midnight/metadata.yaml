# yaml-language-server: $schema=../schema.json
blocks:
  confirmations: 0
  estimateBlockTime: 6
  reorgPeriod: 1
# Midnight has no EVM chain id, so this is a chosen value rather than a derived
# one. The local devnet uses the same 1234 for both chainId and domainId.
chainId: 1234
deployer:
  name: Equilibrium
  url: https://equilibrium.co
displayName: Midnight Stagenet
domainId: 1234
gatewayUrls:
  - http: https://indexer.stagenet.shielded.tools/api/v3/graphql
isTestnet: true
# Required by the SDK - signing throws without it - but absent from
# schema.json, so nothing validates its presence. Tolerated at runtime because
# the metadata schema passes unknown fields through.
midnightNetworkId: stagenet
name: midnight
nativeToken:
  decimals: 6
  denom: night
  name: NIGHT
  symbol: NIGHT
protocol: midnight
# The node speaks websocket only, and an rpcUrls entry must carry `http` per
# the schema, so the wss URL goes there. The agents require rpcUrls to be
# non-empty and then ignore the value: Midnight's submit path is configured
# separately. Reads go to gatewayUrls above, not here.
rpcUrls:
  - http: wss://rpc.stagenet.shielded.tools
technicalStack: polkadotsubstrate
